# What backend.yml doesn't check: that composer.json is valid, and the PHP
# code style (Pint with Flarum's rules: StyleCI's free plan covers public
# repositories only). The theme has no JS, so no frontend workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer:
    name: composer.json
    runs-on: ubuntu-latest
    env:
      # Bespoke is a private package, installed from GitHub with this token.
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

  style:
    name: PHP code style
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test
